name: khata_dost
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  go_router: ^14.2.0
  dio: ^5.6.0
  skeletonizer:
  flutter_secure_storage: ^9.2.2
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  collection: ^1.18.0
  image_picker:
  # Runtime dependency (FlutterNativeSplash.preserve/remove in main.dart +
  # splash_page.dart) — lives in `dependencies`, not dev_dependencies, so
  # depend_on_referenced_packages stays quiet.
  flutter_native_splash: ^2.4.1

# Native splash: solid brand violet, color-only (the old splash_logo.jpg had
# its own baked-in background — the animated in-app SplashPage now draws the
# logo mark instead). Re-generate after editing:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#7C3AED"
  color_dark: "#5B21B6"
  android_12:
    color: "#7C3AED"
    color_dark: "#5B21B6"
  web: false

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21