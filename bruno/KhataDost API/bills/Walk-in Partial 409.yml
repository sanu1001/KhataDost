http:
  method: POST
  url: "{{baseUrl}}/v1/bills"
  body:
    type: json
    data: |-
      {
        "amount_paid": 5,
        "items": [
          { "name": "Chai", "quantity": 1, "unit_price": 10 }
        ]
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
