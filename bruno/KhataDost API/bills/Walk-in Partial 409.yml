      code: |-
        // Walk-in with amount_paid != total: no khata to owe against.
        // Expect 409 {"error":"a walk-in bill must be paid in full"}.
        console.log(res.getStatus(), JSON.stringify(res.getBody()));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
