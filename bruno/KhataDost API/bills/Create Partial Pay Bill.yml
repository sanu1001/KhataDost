    data: |-
      {
        "customer_id": "{{customerId}}",
        "amount_paid": 300,
        "items": [
          { "name": "Rice Bag", "quantity": 1, "unit_price": 250 }
        ]
      }
  auth:
    type: bearer
    token: "{{authToken}}"

